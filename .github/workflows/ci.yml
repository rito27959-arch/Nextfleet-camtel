# NexFleet CAMTEL — intégration continue gratuite (GitHub Actions, dépôt public).
# Produit : rapports de tests, APK Android, paquet DEB (Ubuntu/Debian), installateur EXE (Windows).
# Une étiquette vX.Y.Z, un commit main [release] ou un lancement manuel « publier » publie les paquets.
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier une Release GitHub vAPP_VERSION avec les paquets (crée l'étiquette)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_VERSION: 0.7.2

jobs:
  base-de-donnees:
    name: Base PostgreSQL + PostGIS (63 tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      pg:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: nextfleet, POSTGRES_PASSWORD: nextfleet_dev_only, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nextfleet -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Migrations V1–V10 et campagne de tests
        env:
          NF_ADMIN_PSQL: psql -q -v ON_ERROR_STOP=1 -h localhost -U nextfleet -d postgres
        run: infra/db/tests/run_db_tests.sh
      - name: Migration SQLite — intégrité, coûts, réimport et rollback
        env:
          NF_LEGACY_TEST_DSN: postgresql://nextfleet:nextfleet_dev_only@localhost/nextfleet_test
        run: python3 -m unittest discover -s tools/tests -v

  java:
    name: Maven — noyau, passerelles, API (Testcontainers), bureau
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      pg:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: nextfleet, POSTGRES_PASSWORD: ci_only, POSTGRES_DB: nextfleet_it }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nextfleet" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Base d'intégration (migrations + jeu fictif)
        env: { PGPASSWORD: ci_only }
        run: |
          psql -h localhost -U nextfleet -d nextfleet_it -v ON_ERROR_STOP=1 -q -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS btree_gist; CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          for f in $(ls infra/db/migrations/V*__*.sql | sort -V); do psql -h localhost -U nextfleet -d nextfleet_it -v ON_ERROR_STOP=1 -q -f "$f" > /dev/null; done
          psql -h localhost -U nextfleet -d nextfleet_it -v ON_ERROR_STOP=1 -q -f infra/db/tests/it_fixture.sql
      - name: mvn verify
        run: |
          set -o pipefail
          mvn -B -ntp -fae verify -Dnf.db.url=jdbc:postgresql://localhost:5432/nextfleet_it -Dnf.db.user=nextfleet \
            -Dnf.db.password=ci_only 2>&1 | tee build.log
      - name: Annotations d'échec
        if: failure() || steps.essai-windows.outcome == 'failure'
        run: |
          python3 tools/ci-test-failures.py || true
          tools/ci-annotate.sh build.log Maven
      - name: Bilan des tests (annotation)
        if: always()
        run: |
          B=$(grep -E "^\[(INFO|ERROR|WARNING)\] (Tests run:|Building NexFleet)" build.log | grep -v " -- in " | sed 's/^\[[A-Z]*\] //' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=Maven — bilan::${B}"
      - name: Contrastes et contrats
        run: |
          python3 tools/check_contrast.py
          pip install -q openapi-spec-validator
          openapi-spec-validator shared/api-contract/openapi.yaml
          openapi-spec-validator shared/api-contract/openapi-lot2.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-tests-java
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: nexfleet-api-jar
          path: services/nextfleet-api/target/nextfleet-api-*.jar
          if-no-files-found: ignore

  images:
    name: Images Docker (API, passerelle GPS, Traccar)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/rito27959-arch
    steps:
      - uses: actions/checkout@v5
      - name: Construire les trois images
        run: |
          set -o pipefail
          { docker build -q -f infra/docker/api.Dockerfile -t nexfleet-api . \
            && docker build -q -f infra/docker/gateway.Dockerfile -t nexfleet-gps-gateway . \
            && docker build -q -f infra/docker/traccar.Dockerfile -t nexfleet-traccar . ; } 2>&1 | tee build.log
          echo "::notice title=Images Docker::$(docker images --format '{{.Repository}} {{.Size}}' | grep nexfleet | tr '\n' ' ')"
      - name: Essai de bout en bout de la pile d'hébergement CAMTEL
        run: |
          for img in nexfleet-api nexfleet-gps-gateway nexfleet-traccar; do docker tag "$img" "$REGISTRY/$img:ci"; done
          set -o pipefail
          tools/smoke-stack.sh 2>&1 | tee smoke.log
          echo "::notice title=Pile d'hébergement::$(grep -E '^(OK|Pile)' smoke.log | awk 'BEGIN{ORS="%0A"} {print}')"
      - name: Annotations de l'essai
        if: failure()
        run: tools/ci-annotate.sh smoke.log "Pile d'hébergement"
      - name: Publier sur GitHub Container Registry (branche main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for img in nexfleet-api nexfleet-gps-gateway nexfleet-traccar; do
            for tag in "$APP_VERSION" "sha-${GITHUB_SHA::7}" latest; do
              docker tag "$img" "$REGISTRY/$img:$tag"
              docker push -q "$REGISTRY/$img:$tag"
            done
          done
          echo "::notice title=Images publiées::$REGISTRY/{nexfleet-api,nexfleet-gps-gateway,nexfleet-traccar}:$APP_VERSION (+ latest, sha-${GITHUB_SHA::7})"
      - name: Annotations d'échec
        if: failure() || steps.essai-windows.outcome == 'failure'
        run: tools/ci-annotate.sh build.log Docker

  android:
    name: Android — APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.5.0' }
      - name: Licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Tests unitaires, lint et APK
        working-directory: apps/android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleRelease 2>&1 | tee build.log
        env:
          NF_KEYSTORE_BASE64: ${{ secrets.NF_KEYSTORE_BASE64 }}
          NF_KEYSTORE_PASSWORD: ${{ secrets.NF_KEYSTORE_PASSWORD }}
          NF_KEY_ALIAS: ${{ secrets.NF_KEY_ALIAS }}
          NF_KEY_PASSWORD: ${{ secrets.NF_KEY_PASSWORD }}
      - name: Annotations d'échec
        if: failure() || steps.essai-windows.outcome == 'failure'
        run: |
          tools/ci-annotate.sh apps/android/build.log Android
          for f in apps/android/app/build/reports/lint-results-*.txt; do
            [ -f "$f" ] && echo "::error title=Android — lint::$(grep -v '^\s*$' "$f" | head -80 | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
          done; true
      - name: Renommer les APK
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk dist/nexfleet-${APP_VERSION}-debug.apk
          for f in apps/android/app/build/outputs/apk/release/*.apk; do cp "$f" "dist/nexfleet-${APP_VERSION}-$(basename "$f" .apk | sed 's/^app-//').apk"; done
          ls -la dist
          T=$(find apps/android/app/build/test-results -name 'TEST-*.xml' -exec grep -ho 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' {} + | head -5 | tr '\n' ' ')
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          P=$("$AAPT2" dump permissions dist/nexfleet-${APP_VERSION}-debug.apk 2>&1 | grep -oE "android\.permission\.[A-Z_]+|cm\.camtel[^' ]*" | sort -u | tr '\n' ' ')
          echo "::notice title=Android — bilan::APK : $(cd dist && ls -s --block-size=K *.apk | tr '\n' ' ')%0ATests unitaires : ${T}%0APermissions : ${P}"
      - uses: actions/upload-artifact@v4
        with: { name: nexfleet-android-apk, path: dist/*.apk }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-android
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          if-no-files-found: ignore

  android-captures:
    name: Android — recette visuelle sur émulateur
    needs: [android]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: nexfleet-android-apk, path: apk }
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Émulateur Android 14 (Pixel 7) et captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android-captures.sh "$(ls apk/*-debug.apk)" android-shots
      - name: Publier les captures sur la branche captures-android
        run: |
          N=$(ls android-shots/*.png | wc -l)
          echo "::notice title=Android — captures::$N écrans capturés sur émulateur"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan captures-android
          git rm -rfq --cached . >/dev/null
          git add -f android-shots
          git commit -qm "Captures Android ${GITHUB_SHA::7}"
          git push -qf origin captures-android

  bureau-paquets:
    name: Bureau — ${{ matrix.label }}
    needs: java
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, label: 'DEB (Ubuntu/Debian)', type: deb, classifier: linux, icon: nexfleet.png }
          - { os: windows-2022, label: 'EXE (Windows)', type: exe, classifier: win, icon: nexfleet.ico }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Construire le client bureau
        run: |
          set -o pipefail
          mvn -B -ntp -pl apps/desktop-javafx -am package -DskipTests 2>&1 | tee build.log
      - name: Préparer l'image d'application
        run: |
          T=apps/desktop-javafx/target
          mkdir -p jp/app jp/fx
          cp $T/nextfleet-desktop-*.jar jp/app/
          cp $T/libs/*.jar jp/app/
          # modules JavaFX natifs de la plateforme → runtime ; jars vides retirés du classpath
          mv jp/app/javafx-*-${{ matrix.classifier }}.jar jp/fx/
          rm -f jp/app/javafx-*.jar
          ls jp/app jp/fx
      - name: jpackage (${{ matrix.type }})
        run: |
          exec > >(tee -a build.log) 2>&1
          COMMON=(--name NexFleet --app-version "$APP_VERSION" --vendor "CAMTEL"
                  --description "NexFleet CAMTEL - gestion de flotte" --copyright "CAMTEL")
          # 1. image d'application (runtime Java + JavaFX embarqué), commune à tous les formats
          jpackage --type app-image "${COMMON[@]}" \
            --input jp/app --main-jar "$(cd jp/app && ls nextfleet-desktop-*.jar)" \
            --main-class cm.camtel.nextfleet.desktop.NextfleetDesktopApp \
            --module-path jp/fx \
            --add-modules javafx.controls,javafx.swing,java.net.http,java.sql,java.naming,java.logging,java.desktop,java.prefs,jdk.crypto.ec,jdk.localedata,jdk.unsupported,jdk.charsets \
            --icon apps/desktop-javafx/packaging/${{ matrix.icon }} \
            --dest appimg
          mkdir -p dist
          if [ "${{ matrix.type }}" = deb ]; then
            # postinst/prerm/.desktop propres : l'entrée de menu ne fait jamais échouer l'installation
            jpackage --type deb "${COMMON[@]}" --app-image appimg/NexFleet --dest dist \
              --linux-shortcut --linux-menu-group Office --linux-app-category misc --linux-package-name nexfleet \
              --linux-deb-maintainer "dsir@camtel.invalid" --resource-dir apps/desktop-javafx/packaging/linux
          else
            WIN=(--win-menu --win-menu-group NexFleet --win-shortcut --win-dir-chooser --win-per-user-install
                 --win-upgrade-uuid 6c1f6a7e-3f0b-4f7e-9d0c-2b1a9c4d5e61)
            # MSI : installé directement par Windows Installer (pas d'extraction dans %TEMP%)
            jpackage --type msi "${COMMON[@]}" --app-image appimg/NexFleet --dest dist "${WIN[@]}"
            jpackage --type exe "${COMMON[@]}" --app-image appimg/NexFleet --dest dist "${WIN[@]}"
            # version portable : aucun installateur, décompresser puis lancer NexFleet.exe
            (cd appimg && 7z a -tzip -bd -mx=7 "../dist/NexFleet-$APP_VERSION-windows-portable.zip" NexFleet > /dev/null)
          fi
          ls -la dist
          echo "::notice title=Bureau ${{ matrix.type }} — paquets::$(cd dist && ls -s --block-size=K | tr '\n' ' ')"
      - name: Essai d'installation du MSI et lancement (Windows)
        id: essai-windows
        if: matrix.type == 'exe'
        run: |
          set +e +o pipefail
          exec > >(tee win.log) 2>&1
          trap 'iconv -c -f UTF-16LE -t UTF-8 msi.log 2>/dev/null | grep -iE "return value 3|error|erreur|INSTALLDIR|APPDIR|ProductCode" | tail -25 >> win.log' EXIT
          MSI=$(cygpath -wa "$(ls dist/*.msi)")
          LOGW=$(cygpath -wa msi.log)
          echo "MSI: $MSI"
          # msiexec lancé par PowerShell : arguments Windows intacts (le bash MSYS réécrit les options « //x »)
          timeout 600 powershell -NoProfile -NonInteractive -Command \
            "\$p = Start-Process msiexec.exe -ArgumentList @('/i', '\"$MSI\"', '/qn', '/norestart', '/l*v', '\"$LOGW\"') -Wait -PassThru; exit \$p.ExitCode"
          RC=$?
          echo "msiexec code $RC"
          if [ "$RC" -ne 0 ]; then
            echo "::error title=MSI — échec d'installation (code $RC)::$(iconv -f UTF-16LE -t UTF-8 msi.log 2>/dev/null | grep -iE 'error|erreur|return value 3' | tail -15 | tr -cd '[:print:]\n' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"; exit 1
          fi
          EXE=$(find "$(cygpath -u "$LOCALAPPDATA")" "$(cygpath -u "$PROGRAMFILES")" -maxdepth 3 -iname NexFleet.exe 2>/dev/null | head -1)
          [ -n "$EXE" ] || { echo "::error title=MSI::NexFleet.exe introuvable après installation ($(iconv -f UTF-16LE -t UTF-8 msi.log 2>/dev/null | grep -i 'INSTALLDIR\|APPLICATIONFOLDER' | tail -3 | tr -cd '[:print:]'))"; exit 1; }
          echo "::notice title=MSI installé::$EXE"
          timeout 300 "$EXE" --demo --screenshot="$(cygpath -w "$PWD/win-shots")" > run.log 2>&1 || true
          N=$(ls win-shots/*.png 2>/dev/null | wc -l)
          echo "::notice title=Windows — application lancée::${N} écrans capturés par l'application installée par le MSI"
          [ "$N" -ge 20 ] || { echo "::error title=Windows — lancement::$(tail -30 run.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"; exit 1; }
          timeout 300 powershell -NoProfile -NonInteractive -Command \
            "\$p = Start-Process msiexec.exe -ArgumentList @('/x', '\"$MSI\"', '/qn', '/norestart') -Wait -PassThru; exit \$p.ExitCode" || echo "::warning title=MSI::désinstallation non terminée"
          echo "::notice title=MSI désinstallé::retiré proprement"
          # la version portable démarre aussi, sans installation
          7z x -bd -oportable dist/*portable.zip > /dev/null
          timeout 300 portable/NexFleet/NexFleet.exe --demo --screenshot="$(cygpath -w "$PWD/portable-shots")" > run2.log 2>&1 || true
          P=$(ls portable-shots/*.png 2>/dev/null | wc -l)
          echo "::notice title=Windows — version portable::${P} écrans capturés sans installation"
          [ "$P" -ge 20 ] || { echo "::error title=Windows — portable::$(tail -30 run2.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"; exit 1; }
      - name: Essai d'installation du DEB
        if: matrix.type == 'deb'
        run: |
          echo "::notice title=DEB — dépendances déclarées::$(dpkg-deb -f dist/*.deb Depends)"
          sudo apt-get update -qq
          if ! sudo apt-get install -y ./dist/*.deb > apt.log 2>&1; then
            echo "::error title=DEB — échec d'installation::$(tail -25 apt.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"; exit 1
          fi
          test -x /opt/nexfleet/bin/NexFleet
          echo "::notice title=DEB installé::$(dpkg -s nexfleet | grep -E '^(Version|Installed-Size)' | tr '\n' ' ') ; lanceur /opt/nexfleet/bin/NexFleet présent"
          # lancement réel de l'application installée : parcours de démonstration complet sous Xvfb
          sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a -s "-screen 0 1600x1000x24" timeout 300 /opt/nexfleet/bin/NexFleet --demo --screenshot="$PWD/deb-shots" > run.log 2>&1 || true
          N=$(ls deb-shots/*.png 2>/dev/null | wc -l)
          echo "::notice title=DEB — application lancée::${N} écrans capturés par l'application installée"
          [ "$N" -ge 20 ] || { echo "::error title=DEB — lancement::$(tail -30 run.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"; exit 1; }
          sudo apt-get remove -y nexfleet > /dev/null
          [ ! -e /usr/share/applications/nexfleet-NexFleet.desktop ]
          echo "::notice title=DEB désinstallé::paquet retiré proprement, entrée de menu supprimée"
      - name: Annotations d'échec
        if: failure() || steps.essai-windows.outcome == 'failure'
        run: |
          tools/ci-annotate.sh build.log "Bureau ${{ matrix.type }}"
          tools/ci-annotate.sh win.log "Windows — essai"
      - uses: actions/upload-artifact@v4
        with:
          name: nexfleet-bureau-${{ matrix.type }}
          path: dist/*

  publication:
    name: Publication (étiquette vX.Y.Z)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publier) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: [base-de-donnees, java, android, bureau-paquets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, pattern: 'nexfleet-*', merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          name: NexFleet CAMTEL ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          target_commitish: ${{ github.sha }}
          files: |
            out/*.apk
            out/*.deb
            out/*.exe
            out/*.msi
            out/*portable.zip
            out/nextfleet-api-*.jar
          body: |
            NexFleet CAMTEL ${{ env.APP_VERSION }} — paquets construits par la CI GitHub.
            Version de démonstration et de recette : ni homologation CAMTEL, ni mise en production.
            Voir docs/ETAT_AVANCEMENT.md et docs/INSTALLATION.md.

            - nexfleet_*_amd64.deb : Ubuntu 22.04 / 24.04, Debian 12+ (sudo apt install ./nexfleet_*.deb)
            - NexFleet-*.msi : Windows 10/11, installateur recommandé (installation par utilisateur, sans droits administrateur)
            - NexFleet-*-windows-portable.zip : Windows sans installation (décompresser, lancer NexFleet\NexFleet.exe)
            - NexFleet-*.exe : ancien installateur (non signé : SmartScreen demandera confirmation)
            - nexfleet-*-debug.apk : Android 8+, pour essai (signé avec une clé de débogage)
            - nextfleet-api-*.jar : API Spring Boot (Java 21, PostgreSQL 16 + PostGIS)
