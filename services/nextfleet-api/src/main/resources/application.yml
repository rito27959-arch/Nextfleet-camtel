# NexFleet API — configuration. Aucun secret ici : tout passe par variables d'environnement ou coffre (SEC-04).
spring:
  application:
    name: nextfleet-api
  datasource:
    url: ${NF_DB_URL:jdbc:postgresql://localhost:5432/nextfleet}
    username: ${NF_DB_USER:nextfleet}
    password: ${NF_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Les extensions (postgis, btree_gist, pgcrypto) sont créées par le DBA avant la première migration.
  jackson:
    time-zone: UTC                # RG-05 : stockage et échange en UTC ; affichage Africa/Douala côté clients
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 40MB         # pièces justificatives : 10 Mo (vérifié par FileService) ; base de reprise : 40 Mo
      max-request-size: 41MB

server:
  port: ${PORT:${NF_PORT:8080}}
  forward-headers-strategy: native
  shutdown: graceful
  compression:                # listes JSON ~85 % plus légères sur les liaisons mobiles et satellitaires
    enabled: true
    mime-types: application/json,application/problem+json,text/csv,text/plain
    min-response-size: 1024
  error:
    include-stacktrace: never
    include-message: never

nextfleet:
  environment: ${NF_ENVIRONMENT:DEV}        # DEV | TEST | DEMO | PREPROD | PRODUCTION (NF-04)
  session:
    ttl: ${NF_SESSION_TTL:PT8H}
    max-failed-logins: 5
    lockout: PT15M
  cors:
    allowed-origins: ""                     # clients natifs : pas de CORS par défaut

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    enabled: ${NF_SWAGGER_UI:false}

# GPS : la clé HMAC des jetons de mission est PARTAGÉE avec la passerelle (même variable NF_MISSION_TOKEN_KEY, base64 ≥ 32 octets).
# Sans clé, le démarrage de mission répond 409 « Passerelle GPS non configurée » : aucune collecte possible.
nextfleet.gps:
  mission-token-key: ${NF_MISSION_TOKEN_KEY:}
  mission-token-ttl: ${NF_MISSION_TOKEN_TTL:PT12H}
  gateway-public-url: ${NF_GPS_PUBLIC_URL:}
  notice-versions: ${NF_GPS_NOTICE_VERSIONS:NOTICE-GPS-v1}

# Traccar (facultatif) : compte de service à droits limités. Les clients ne parlent jamais à Traccar.
nextfleet.traccar:
  url: ${NF_TRACCAR_URL:}
  token: ${NF_TRACCAR_TOKEN:}
  user: ${NF_TRACCAR_USER:}
  password: ${NF_TRACCAR_PASSWORD:}

# Amorçage d'une instance neuve (désactivé par défaut) et démonstration hébergée.
nextfleet.bootstrap:
  enabled: ${NF_BOOTSTRAP:false}
  admin-login: ${NF_BOOTSTRAP_ADMIN_LOGIN:}
  admin-password: ${NF_BOOTSTRAP_ADMIN_PASSWORD:}
  demo-password: ${NF_DEMO_PASSWORD:}
nextfleet.demo:
  simulator: ${NF_DEMO_SIMULATOR:false}
