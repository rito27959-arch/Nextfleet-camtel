# Environnement LOCAL de développement uniquement (jamais en production). Aucun secret réel.
# docker compose -f infra/compose.local.yaml up -d
# STATUT : non exécuté dans l'environnement de réalisation (Docker indisponible).
name: nextfleet-local
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nextfleet
      POSTGRES_USER: nextfleet
      POSTGRES_PASSWORD: ${NF_DB_PASSWORD:?définir NF_DB_PASSWORD dans un fichier .env local non versionné}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro

  api:
    build: ../services/nextfleet-api           # nécessite un Dockerfile après le premier build Maven réussi
    profiles: ["api"]
    environment:
      NF_DB_URL: jdbc:postgresql://db:5432/nextfleet
      NF_DB_USER: nextfleet
      NF_DB_PASSWORD: ${NF_DB_PASSWORD}
      NF_ENVIRONMENT: DEV
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [db]

  # Traccar : service distinct, non exposé aux clients (règle cardinale 3). Activation après décision D08.
  # Il transmet chaque position à la passerelle NexFleet (forward.type=json) : voir infra/traccar/traccar.xml.
  traccar:
    image: traccar/traccar:latest          # version à figer après qualification (nomenclature DSIR)
    profiles: ["gps"]
    environment:
      NF_TRACCAR_FORWARD_SECRET: ${NF_TRACCAR_FORWARD_SECRET:?secret partagé Traccar → passerelle}
    volumes:
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    ports: ["127.0.0.1:8082:8082", "127.0.0.1:5055:5055"]   # 8082 : console d'admin ; 5055 : OsmAnd (relais passerelle)

  # Passerelle GPS NexFleet : reçoit Traccar et les lots Android, applique la règle « mission uniquement ».
  gps-gateway:
    build: ../services/gps-traccar-adapter    # Dockerfile à écrire après le premier build Maven
    profiles: ["gps"]
    environment:
      NF_DB_URL: jdbc:postgresql://db:5432/nextfleet
      NF_DB_USER: nextfleet
      NF_DB_PASSWORD: ${NF_DB_PASSWORD}
      NF_TRACCAR_FORWARD_SECRET: ${NF_TRACCAR_FORWARD_SECRET}
      NF_MISSION_TOKEN_KEY: ${NF_MISSION_TOKEN_KEY:?clé HMAC base64 de 32 octets et plus}
      NF_TRACCAR_OSMAND_URL: http://traccar:5055
      NF_GPS_BIND: 0.0.0.0:8090
    ports: ["127.0.0.1:8090:8090"]
    depends_on: [db]

  # Messagerie pilote (WebSocket) ; derrière un frontal TLS (WSS) hors poste de développement.
  chat:
    build: ../services/chat-realtime
    profiles: ["chat"]
    environment:
      NF_DB_URL: jdbc:postgresql://db:5432/nextfleet
      NF_DB_USER: nextfleet
      NF_DB_PASSWORD: ${NF_DB_PASSWORD}
      NF_CHAT_BIND: 0.0.0.0:8091
    ports: ["127.0.0.1:8091:8091"]
    depends_on: [db]

volumes:
  db-data:
